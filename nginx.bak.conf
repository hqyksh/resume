# Nginx 配置 - Next.js 多语言支持 + SSL
# 证书使用 Let's Encrypt (certbot) 自动申请

upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# 限制请求速率（防止暴力攻击）
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name portfolio.wxappdev.top;

    # Let's Encrypt 证书验证（certbot 需要访问此路径）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余所有请求跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name portfolio.wxappdev.top;

    # ── SSL 证书路径（DNSPod 证书）────────────────────────────────
    ssl_certificate     /home/ubuntu/ssl/portfolio.wxappdev.top_nginx/portfolio.wxappdev.top_bundle.crt;
    ssl_certificate_key /home/ubuntu/ssl/portfolio.wxappdev.top_nginx/portfolio.wxappdev.top.key;

    # ── SSL 安全参数 ──────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling（加速 SSL 握手）
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /home/ubuntu/ssl/portfolio.wxappdev.top_nginx/portfolio.wxappdev.top_bundle.crt;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # 日志
    access_log /var/log/nginx/nextjs_access.log;
    error_log /var/log/nginx/nextjs_error.log;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;

    # 限制请求体大小
    client_max_body_size 10m;

    # 屏蔽常见恶意 User-Agent
    if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|zgrab)) {
        return 444;
    }

    # 屏蔽常见扫描路径
    location ~* \.(php|asp|aspx|jsp|cgi|sh|bash|env|git|svn|htaccess|htpasswd)$ {
        return 404;
    }

    # 静态资源缓存
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 图片和静态文件
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|avif|woff|woff2|ttf|eot|pdf)$ {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API 路由限速（每分钟 30 次）
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 所有请求代理到 Next.js
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
